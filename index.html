<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover" />
    <title>Videiras - Cellar Collection</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Outfit', system-ui, sans-serif; }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #0d0b09; }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
      input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
      /* ponytail: modal sizing via !important over inline styles (.vt-m = any modal) — avoids threading props through every field */
      .vt-m input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]), .vt-m select { min-height: 48px; font-size: 16px !important; border-radius: 12px !important; }
      .vt-m textarea { font-size: 16px !important; border-radius: 12px !important; }
      .vt-m label { font-size: 12px !important; }
      .vt-m select ~ button { min-width: 48px; align-self: stretch; justify-content: center; border-radius: 12px !important; }
      .vt-m .vt-btn { min-height: 48px; font-size: 16px !important; font-weight: 500 !important; padding: 0 22px !important; border-radius: 14px !important; justify-content: center; }
      .vt-m .vt-actions { position: sticky; bottom: 0; z-index: 5; margin: 20px -28px 0 !important; padding: 16px 28px 20px; background: #1e1b16; border-top: 1px solid rgba(255,255,255,0.08); }
      .vt-m .vt-actions + .vt-endpad { display: none; }
      .vt-m .vt-msub { font-size: 15px !important; }
      .vt-m .vt-close { width: 44px; height: 44px; border-radius: 22px !important; background: #2a261f !important; display: flex; align-items: center; justify-content: center; color: #e8dece !important; }
      .vt-m .vt-mtitle { font-size: 24px !important; font-weight: 400 !important; }
      .vt-m .vt-ac-item { padding: 10px 14px !important; min-height: 56px; }
      .vt-m .vt-ac-name { font-size: 15px !important; }
      .vt-m .vt-ac-meta { font-size: 13px !important; }
      .vt-m .vt-ac-btn { min-height: 36px; padding: 0 12px !important; font-size: 13px !important; border-radius: 10px !important; color: #e8dece !important; }
      /* data compacta: o iOS ignora a altura de inputs date com aparência nativa */
      .vt-m input.vt-date { -webkit-appearance: none; appearance: none; display: block; height: 52px; line-height: 52px; padding: 0 12px !important; }
      .vt-date::-webkit-date-and-time-value { text-align: left; margin: 0; }
      .vt-legible { zoom: 1.15; }
      .vt-legible input, .vt-legible select, .vt-legible textarea { font-size: 16px !important; }
      @media (max-width: 767px) {
        body { -webkit-tap-highlight-color: transparent; }
        .vt-m input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]), .vt-m select { min-height: 52px; font-size: 17px !important; border-radius: 14px !important; }
        .vt-m textarea { font-size: 17px !important; border-radius: 14px !important; }
        .vt-m label { font-size: 13px !important; }
        .vt-m select ~ button { min-width: 52px; border-radius: 14px !important; }
        .vt-m .vt-btn { min-height: 54px; font-size: 17px !important; padding: 0 20px !important; border-radius: 16px !important; }
        .vt-m .vt-actions { margin: 20px -16px 0 !important; padding: 12px 16px max(16px, env(safe-area-inset-bottom)); }
        .vt-m .vt-actions .vt-btn { flex: 1; }
        .vt-m .vt-close { width: 48px; height: 48px; border-radius: 24px !important; }
        .vt-m .vt-ac-item { padding: 12px 14px !important; min-height: 64px; }
        .vt-m .vt-ac-name { font-size: 16px !important; }
        .vt-m .vt-ac-meta { font-size: 14px !important; }
        .vt-m .vt-ac-btn { min-height: 44px; border-radius: 12px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
